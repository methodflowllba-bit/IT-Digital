<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brasformer | IT Digital</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><img src="assets/cabecalho-brasformer.png" alt="Brasformer Transformadores — Fluxo de Uso: Instrução de Trabalho Digital"></header>
<section id="login" class="auth-panel"><h2>Acesso ao IT Digital</h2><form id="login-form"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="action">Entrar</button></form><p id="auth-message" role="status">Conectando…</p></section><div id="account-bar" hidden></div><main hidden>
<div class="topbar"><div><span class="eyebrow">INSTRUÇÃO DE TRABALHO DIGITAL</span><h1 id="title">Informação certa, na hora certa.</h1></div><time id="clock"></time></div>
<section id="home" aria-label="Menu principal"><p>Selecione uma opção para começar.</p><div class="grid">
<button data-screen="sectors"><span class="icon">▥</span>Setores<small>Acesse sua área de trabalho</small></button>
<button data-screen="search"><span class="icon">⌕</span>Buscar<small>Encontre uma instrução</small></button>
<button data-screen="qr"><span class="icon">▦</span>QR Code<small>Acesse pelo código da IT</small></button>
<button data-screen="products"><span class="icon">⬡</span>Produtos<small>Consulte os produtos</small></button>
<button data-screen="mine"><span class="icon">▤</span>Meus favoritos<small>Suas ITs, desenhos e vídeos favoritos</small></button>
<button data-screen="settings"><span class="icon">⚙</span>Configurações<small>Ajuste a visualização</small></button>
</div></section>
<section id="detail" hidden><button class="back" id="back">← Voltar</button><h2 id="section-title"></h2><div id="content"></div></section>
</main><footer>BRASFORMER <span style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><img src="logo.png" alt="Method Flow" style="width:110px;height:auto;flex-shrink:0"> <span>IT Digital · Padronização, qualidade e produtividade</span></span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js"></script><script src="supabase-app.js"></script></body></html>
